<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5ef">
  <title>Daymark — a little more intentional</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f5ef;
      --surface: #fffefa;
      --ink: #202b27;
      --muted: #79817b;
      --line: #e5e8df;
      --green: #39745a;
      --green-dark: #28523f;
      --lime: #d8f27a;
      --coral: #e8755d;
      --shadow: 0 18px 55px rgb(39 56 44 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#dfe4d9 0.7px, transparent 0.7px);
      background-size: 17px 17px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .app-shell {
      width: min(1120px, calc(100% - 56px));
      min-height: calc(100vh - 64px);
      margin: 32px auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgb(32 43 39 / 8%);
      border-radius: 8px;
      box-shadow: var(--shadow);
      animation: arrive 450ms ease-out both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      height: 76px;
      padding: 0 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.2px;
    }

    .brand-mark {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      background: var(--lime);
      border-radius: 50%;
      font-size: 16px;
      letter-spacing: 0;
    }

    .topbar-date {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .35px;
    }

    .workspace {
      min-height: 690px;
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
    }

    .sidebar {
      padding: 36px 18px 28px 28px;
      border-right: 1px solid var(--line);
    }

    .side-label {
      margin: 0 0 15px 12px;
      color: #9ba29a;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .nav-list { display: grid; gap: 5px; }

    .nav-button {
      width: 100%;
      min-height: 43px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 0;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background 150ms ease, color 150ms ease;
    }

    .nav-button:hover { background: #f2f4ed; }
    .nav-button[aria-current="page"] { color: var(--green-dark); background: #edf3e5; font-weight: 700; }
    .nav-name { display: flex; align-items: center; gap: 11px; font-size: 13px; }

    .nav-dot {
      width: 8px;
      height: 8px;
      border: 1.5px solid #9ba59b;
      border-radius: 50%;
    }

    .nav-button[aria-current="page"] .nav-dot { border-color: var(--green); background: var(--green); }
    .nav-count { color: #929a92; font-size: 11px; font-variant-numeric: tabular-nums; }

    .sidebar-note {
      margin: 47px 8px 0 0;
      padding: 16px 15px;
      background: #f2f5e8;
      border-left: 3px solid var(--lime);
      border-radius: 0 5px 5px 0;
    }

    .note-mark { margin-bottom: 8px; color: var(--green); font-family: Georgia, serif; font-size: 22px; }
    .sidebar-note p { margin: 0; color: #59645b; font-family: Georgia, serif; font-size: 13px; line-height: 1.55; }

    .main-content { min-width: 0; padding: 43px 50px 38px; }

    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 27px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(31px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.08;
    }

    .heading-date { margin: 9px 0 0; color: var(--muted); font-size: 12px; }

    .progress-badge {
      min-width: 94px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--green-dark);
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }

    .progress-badge strong { font-size: 15px; }

    .progress-track { height: 3px; margin: -8px 0 26px; overflow: hidden; background: #edf0e9; border-radius: 4px; }
    .progress-fill { width: 0; height: 100%; background: var(--green); transition: width 220ms ease; }

    .task-form {
      min-height: 58px;
      margin-bottom: 30px;
      padding: 7px 8px 7px 15px;
      display: flex;
      align-items: center;
      gap: 9px;
      background: #f7f8f3;
      border: 1px solid #e6e9e0;
      border-radius: 6px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .task-form:focus-within { border-color: #96b49b; box-shadow: 0 0 0 3px rgb(57 116 90 / 9%); }

    .add-plus { color: var(--green); font-size: 22px; font-weight: 400; line-height: 1; }

    .task-input {
      width: 100%;
      min-width: 90px;
      padding: 9px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
    }

    .task-input::placeholder { color: #9ba29b; }

    .form-date, .form-priority {
      height: 34px;
      padding: 0 7px;
      border: 0;
      border-left: 1px solid var(--line);
      outline-color: #96b49b;
      background: transparent;
      color: #727b73;
      font-size: 11px;
    }

    .form-date { width: 125px; }
    .form-priority { width: 91px; }

    .add-button {
      min-height: 38px;
      padding: 0 14px;
      border: 0;
      border-radius: 4px;
      background: var(--green);
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: translateY(1px); }

    .list-heading {
      min-height: 30px;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .list-heading h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 400; }
    .list-heading span { color: #969e96; font-size: 11px; }

    .task-list { margin: 0; padding: 0; list-style: none; }

    .task-row {
      min-height: 68px;
      padding: 12px 3px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto auto 28px;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #edf0e9;
      animation: row-in 230ms ease-out both;
    }

    @keyframes row-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .task-check {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-copy { min-width: 0; }
    .task-title { overflow-wrap: anywhere; color: #303a34; font-size: 13px; line-height: 1.45; }
    .task-date { margin-top: 4px; color: #929a92; font-size: 10px; }

    .task-row.is-complete .task-title { color: #9ba29b; text-decoration: line-through; text-decoration-color: #b7beb7; }
    .task-row.is-complete .task-date { color: #b2b8b1; }
    .task-row.is-complete .task-note-preview { color: #a8afa6; border-left-color: #e4eacd; }

    .priority {
      padding: 5px 8px;
      border-radius: 3px;
      background: #f0f2ed;
      color: #6f786f;
      font-size: 9px;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .priority.high { background: #fbede7; color: #b65039; }
    .priority.low { background: #edf3e8; color: #55744e; }

    .task-note-preview {
      width: 100%;
      margin-top: 7px;
      padding: 6px 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      border: 0;
      border-left: 3px solid var(--lime);
      border-radius: 0 4px 4px 0;
      background: #f2f5e8;
      color: #5b655d;
      cursor: pointer;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .task-note-preview:hover { background: #eef2e2; color: #4b554d; }

    .note-toggle {
      width: 28px;
      height: 30px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #b0b7af;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .note-toggle:hover { background: #f2f5e8; color: var(--green-dark); }
    .note-toggle.has-note { color: var(--green); }

    .note-editor {
      padding: 10px 11px 9px;
      grid-column: 1 / -1;
      background: #f7f8f3;
      border: 1px solid #e6e9e0;
      border-radius: 6px;
    }

    .note-input {
      width: 100%;
      min-height: 62px;
      padding: 6px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: 0;
      background: var(--surface);
      color: #303a34;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      line-height: 1.55;
      resize: vertical;
    }

    .note-input::placeholder { color: #9ba29b; }
    .note-input:focus { border-color: #96b49b; box-shadow: 0 0 0 3px rgb(57 116 90 / 9%); }

    .note-actions { margin-top: 8px; display: flex; align-items: center; gap: 7px; }

    .note-save {
      min-height: 30px;
      padding: 0 11px;
      border: 0;
      border-radius: 4px;
      background: var(--green);
      color: white;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      transition: background 150ms ease, transform 150ms ease;
    }

    .note-save:hover { background: var(--green-dark); }
    .note-save:active { transform: translateY(1px); }

    .note-cancel, .note-remove {
      min-height: 30px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--green);
      cursor: pointer;
      font-size: 11px;
    }

    .note-cancel:hover { color: var(--green-dark); text-decoration: underline; }
    .note-remove { color: #a5593f; }
    .note-remove:hover { text-decoration: underline; }

    .note-meta { margin-left: auto; display: flex; align-items: center; gap: 10px; color: #9ba29b; font-size: 9px; white-space: nowrap; }
    .note-count { font-variant-numeric: tabular-nums; }

    .delete-button {
      width: 28px;
      height: 30px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #a0a79f;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    .delete-button:hover { background: #fbede7; color: #b65039; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #72977a; outline-offset: 2px; }

    .empty-state {
      padding: 50px 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon { width: 42px; height: 42px; margin: 0 auto 13px; display: grid; place-items: center; border: 1px solid #dfe6d9; border-radius: 50%; color: var(--green); font-family: Georgia, serif; font-size: 22px; }
    .empty-state h3 { margin: 0 0 6px; color: var(--ink); font-family: Georgia, serif; font-size: 17px; font-weight: 400; }
    .empty-state p { margin: 0; font-size: 12px; }

    .list-footer {
      min-height: 48px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #939b93;
      font-size: 10px;
    }

    .clear-actions { display: flex; align-items: center; gap: 14px; }

    .clear-button { padding: 7px 0; border: 0; background: transparent; color: var(--green); cursor: pointer; font-size: 10px; }
    .clear-button:hover { color: var(--green-dark); text-decoration: underline; }
    .clear-button:disabled { color: #b4bab3; cursor: default; text-decoration: none; }
    .clear-button.all { color: #9aa19a; }
    .clear-button.all:hover { color: #b65039; }
    .clear-button.all.confirm { color: var(--coral); font-weight: 700; text-decoration: underline; }

    @media (max-width: 760px) {
      .app-shell { width: min(100% - 24px, 620px); min-height: calc(100vh - 24px); margin: 12px auto; }
      .topbar { height: 64px; padding: 0 22px; }
      .workspace { min-height: 0; grid-template-columns: 1fr; }
      .sidebar { padding: 16px 20px 0; border-right: 0; }
      .side-label, .sidebar-note { display: none; }
      .nav-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
      .nav-button { min-height: 40px; padding: 0 9px; justify-content: center; gap: 7px; }
      .nav-name { gap: 7px; font-size: 11px; }
      .nav-count { font-size: 10px; }
      .main-content { padding: 28px 22px 24px; }
      .page-heading { margin-bottom: 23px; }
      .task-form { flex-wrap: wrap; padding: 9px 10px 9px 13px; }
      .task-input { flex: 1 1 calc(100% - 35px); }
      .form-date { margin-left: 27px; }
      .form-date, .form-priority { border-left: 0; border-top: 1px solid var(--line); }
      .add-button { margin-left: auto; }
    }

    @media (max-width: 420px) {
      .app-shell { width: 100%; margin: 0; border: 0; border-radius: 0; }
      .topbar { padding: 0 18px; }
      .topbar-date { font-size: 10px; }
      .sidebar { padding-right: 14px; padding-left: 14px; }
      .nav-button { padding: 0 5px; }
      .nav-name { gap: 5px; font-size: 10px; }
      .main-content { padding-right: 18px; padding-left: 18px; }
      .progress-badge { min-width: 78px; padding: 9px 7px; font-size: 10px; }
      .task-row { grid-template-columns: 20px minmax(0, 1fr) auto auto 25px; gap: 8px; }
      .priority { padding: 5px 6px; font-size: 8px; }
      .note-toggle { width: 25px; font-size: 12px; }
      .note-actions { flex-wrap: wrap; }
      .note-meta { margin-left: 0; flex: 1 1 100%; justify-content: flex-end; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">d</span> DAYMARK</div>
      <time class="topbar-date" id="topbar-date"></time>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="Task views">
        <p class="side-label">Your list</p>
        <nav class="nav-list" aria-label="Filter tasks">
          <button class="nav-button" type="button" data-view="today" aria-current="page">
            <span class="nav-name"><span class="nav-dot" aria-hidden="true"></span>Today</span><span class="nav-count" id="count-today">0</span>
          </button>
          <button class="nav-button" type="button" data-view="upcoming">
            <span class="nav-name"><span class="nav-dot" aria-hidden="true"></span>Upcoming</span><span class="nav-count" id="count-upcoming">0</span>
          </button>
          <button class="nav-button" type="button" data-view="completed">
            <span class="nav-name"><span class="nav-dot" aria-hidden="true"></span>Completed</span><span class="nav-count" id="count-completed">0</span>
          </button>
        </nav>
        <div class="sidebar-note" aria-label="A little reminder">
          <div class="note-mark" aria-hidden="true">“</div>
          <p>Small steps still move you forward.</p>
        </div>
      </aside>

      <main class="main-content">
        <section class="page-heading" aria-labelledby="page-title">
          <div>
            <p class="eyebrow" id="heading-eyebrow">A fresh page</p>
            <h1 id="page-title">Today, in motion.</h1>
            <p class="heading-date" id="heading-date"></p>
          </div>
          <div class="progress-badge" id="progress-badge" aria-live="polite"><strong>0 / 0</strong><br>done</div>
        </section>

        <div class="progress-track" role="progressbar" aria-label="Today's tasks completed" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

        <form class="task-form" id="task-form">
          <span class="add-plus" aria-hidden="true">+</span>
          <label for="task-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">New task</label>
          <input class="task-input" id="task-input" name="title" type="text" placeholder="What would you like to get done?" maxlength="140" required autocomplete="off">
          <label for="task-date" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Due date</label>
          <input class="form-date" id="task-date" name="dueDate" type="date" aria-label="Due date">
          <label for="task-priority" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Priority</label>
          <select class="form-priority" id="task-priority" name="priority" aria-label="Priority">
            <option value="normal">Normal</option>
            <option value="high">Important</option>
            <option value="low">Whenever</option>
          </select>
          <button class="add-button" type="submit">Add task</button>
        </form>

        <section aria-labelledby="list-title">
          <div class="list-heading"><h2 id="list-title">Your focus</h2><span id="list-count"></span></div>
          <ul class="task-list" id="task-list" aria-live="polite"></ul>
          <div class="list-footer">
            <span id="footer-count"></span>
            <div class="clear-actions">
              <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
              <button class="clear-button all" id="clear-all" type="button" title="Empty every list in this app">Clear all tasks</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    (() => {
      const storageKey = "daymark.tasks.v2";
      const retiredStorageKeys = ["daymark.tasks.v1"];
      const noteLimit = 500;
      const today = new Date();
      const dateKey = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      };
      const todayKey = dateKey(today);

      // Lists start empty: anything saved by earlier versions is discarded on start-up.
      retiredStorageKeys.forEach((key) => {
        try { localStorage.removeItem(key); }
        catch { /* Nothing to retire when storage is unavailable. */ }
      });

      let tasks = loadTasks();
      let activeView = "today";
      let openNoteId = null;
      let noteDraft = null;
      let pendingNoteFocus = false;
      let clearAllTimer = null;

      const elements = {
        topbarDate: document.getElementById("topbar-date"),
        headingDate: document.getElementById("heading-date"),
        headingEyebrow: document.getElementById("heading-eyebrow"),
        pageTitle: document.getElementById("page-title"),
        progressBadge: document.getElementById("progress-badge"),
        progressTrack: document.getElementById("progress-track"),
        progressFill: document.getElementById("progress-fill"),
        taskForm: document.getElementById("task-form"),
        taskInput: document.getElementById("task-input"),
        taskDate: document.getElementById("task-date"),
        taskPriority: document.getElementById("task-priority"),
        taskList: document.getElementById("task-list"),
        listTitle: document.getElementById("list-title"),
        listCount: document.getElementById("list-count"),
        footerCount: document.getElementById("footer-count"),
        clearCompleted: document.getElementById("clear-completed"),
        clearAll: document.getElementById("clear-all"),
        navButtons: [...document.querySelectorAll(".nav-button")]
      };

      function withNote(task) {
        return { ...task, note: typeof task.note === "string" ? task.note : "" };
      }

      function loadTasks() {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === null) return [];
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) ? parsed.filter(Boolean).map(withNote) : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        try { localStorage.setItem(storageKey, JSON.stringify(tasks)); }
        catch { /* The list remains usable for this session if storage is unavailable. */ }
      }

      function prettyDate(value, includeWeekday = true) {
        const [year, month, day] = value.split("-").map(Number);
        return new Intl.DateTimeFormat(undefined, {
          weekday: includeWeekday ? "long" : undefined,
          month: "long",
          day: "numeric",
          year: "numeric"
        }).format(new Date(year, month - 1, day));
      }

      function visibleTasks() {
        if (activeView === "completed") return tasks.filter((task) => task.completed);
        if (activeView === "upcoming") return tasks.filter((task) => !task.completed && task.dueDate > todayKey);
        return tasks.filter((task) => !task.completed && task.dueDate <= todayKey);
      }

      function updateCounts() {
        const todayCount = tasks.filter((task) => !task.completed && task.dueDate <= todayKey).length;
        const upcomingCount = tasks.filter((task) => !task.completed && task.dueDate > todayKey).length;
        const completedCount = tasks.filter((task) => task.completed).length;
        document.getElementById("count-today").textContent = todayCount;
        document.getElementById("count-upcoming").textContent = upcomingCount;
        document.getElementById("count-completed").textContent = completedCount;

        const todaysTasks = tasks.filter((task) => task.dueDate <= todayKey);
        const todaysDone = todaysTasks.filter((task) => task.completed).length;
        const percentage = todaysTasks.length ? Math.round(todaysDone / todaysTasks.length * 100) : 0;
        elements.progressBadge.innerHTML = `<strong>${todaysDone} / ${todaysTasks.length}</strong><br>done`;
        elements.progressFill.style.width = `${percentage}%`;
        elements.progressTrack.setAttribute("aria-valuemax", String(todaysTasks.length));
        elements.progressTrack.setAttribute("aria-valuenow", String(todaysDone));
        elements.clearCompleted.disabled = completedCount === 0;
        elements.clearAll.disabled = tasks.length === 0;
        disarmClearAll();
      }

      function disarmClearAll() {
        if (clearAllTimer) {
          clearTimeout(clearAllTimer);
          clearAllTimer = null;
        }
        elements.clearAll.textContent = "Clear all tasks";
        elements.clearAll.classList.remove("confirm");
        elements.clearAll.title = "Empty every list in this app";
      }

      function render() {
        const visible = visibleTasks().sort((a, b) => a.dueDate.localeCompare(b.dueDate));
        if (openNoteId && !visible.some((task) => task.id === openNoteId)) {
          openNoteId = null;
          noteDraft = null;
        }
        const viewDetails = {
          today: { title: "Today, in motion.", eyebrow: "A fresh page", list: "Your focus", empty: "Nothing on today's list", hint: "Add a task above, or take a moment for yourself." },
          upcoming: { title: "A little further ahead.", eyebrow: "When you're ready", list: "Coming up", empty: "Nothing planned ahead", hint: "Give a future task a due date when you add it." },
          completed: { title: "Look what you did.", eyebrow: "Progress, not perfection", list: "Already done", empty: "Your finished tasks will land here", hint: "Check off a task to see it here." }
        }[activeView];

        elements.pageTitle.textContent = viewDetails.title;
        elements.headingEyebrow.textContent = viewDetails.eyebrow;
        elements.listTitle.textContent = viewDetails.list;
        elements.listCount.textContent = `${visible.length} ${visible.length === 1 ? "task" : "tasks"}`;
        elements.headingDate.textContent = activeView === "today" ? prettyDate(todayKey) : "One thing at a time is enough.";
        elements.taskDate.value = todayKey;
        elements.topbarDate.textContent = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" }).format(today);
        elements.taskList.replaceChildren();

        if (visible.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          empty.innerHTML = `<div class="empty-icon" aria-hidden="true">${activeView === "completed" ? "✓" : "·"}</div><h3>${viewDetails.empty}</h3><p>${viewDetails.hint}</p>`;
          elements.taskList.append(empty);
        } else {
          visible.forEach((task, index) => elements.taskList.append(createTaskRow(task, index)));
        }

        if (pendingNoteFocus) {
          pendingNoteFocus = false;
          const field = elements.taskList.querySelector(".note-input");
          if (field) {
            const caret = field.value.length;
            field.focus();
            field.setSelectionRange(caret, caret);
          }
        }

        const remainingToday = tasks.filter((task) => !task.completed && task.dueDate <= todayKey).length;
        elements.footerCount.textContent = activeView === "today"
          ? `${remainingToday} ${remainingToday === 1 ? "task" : "tasks"} left today`
          : `${visible.length} ${visible.length === 1 ? "task" : "tasks"} in this view`;
        elements.navButtons.forEach((button) => {
          if (button.dataset.view === activeView) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
        updateCounts();
      }

      function openNote(taskId, draft) {
        openNoteId = taskId;
        noteDraft = draft;
        pendingNoteFocus = true;
        render();
      }

      function closeNoteEditor() {
        openNoteId = null;
        noteDraft = null;
      }

      function createNoteEditor(task) {
        const editor = document.createElement("div");
        editor.className = "note-editor";
        editor.setAttribute("role", "group");
        editor.setAttribute("aria-label", `Note for: ${task.title}`);

        const field = document.createElement("textarea");
        field.className = "note-input";
        field.rows = 3;
        field.maxLength = noteLimit;
        field.placeholder = "Add anything worth remembering about this task…";
        field.value = noteDraft ?? task.note;
        field.setAttribute("aria-label", `Note for: ${task.title}`);

        const actions = document.createElement("div");
        actions.className = "note-actions";

        const save = document.createElement("button");
        save.className = "note-save";
        save.type = "button";
        save.textContent = "Save note";

        const cancel = document.createElement("button");
        cancel.className = "note-cancel";
        cancel.type = "button";
        cancel.textContent = "Cancel";

        const meta = document.createElement("div");
        meta.className = "note-meta";
        const hint = document.createElement("span");
        hint.textContent = "Ctrl / ⌘ + Enter to save · Esc to close";
        const count = document.createElement("span");
        count.className = "note-count";
        meta.append(hint, count);

        const updateCount = () => { count.textContent = `${field.value.length} / ${noteLimit}`; };
        const commit = () => {
          task.note = field.value.trim();
          closeNoteEditor();
          saveTasks();
          render();
        };
        const discard = () => {
          closeNoteEditor();
          render();
        };

        save.addEventListener("click", commit);
        cancel.addEventListener("click", discard);
        field.addEventListener("input", () => {
          noteDraft = field.value;
          updateCount();
        });
        field.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            discard();
          }
          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            commit();
          }
        });

        actions.append(save, cancel, meta);

        if (task.note) {
          const clear = document.createElement("button");
          clear.className = "note-remove";
          clear.type = "button";
          clear.textContent = "Remove note";
          clear.addEventListener("click", () => {
            task.note = "";
            closeNoteEditor();
            saveTasks();
            render();
          });
          actions.insertBefore(clear, meta);
        }

        updateCount();
        editor.append(field, actions);
        return editor;
      }

      function createTaskRow(task, index) {
        const item = document.createElement("li");
        item.className = `task-row${task.completed ? " is-complete" : ""}`;
        item.style.animationDelay = `${Math.min(index * 35, 175)}ms`;
        const noteOpen = openNoteId === task.id;

        const checkbox = document.createElement("input");
        checkbox.className = "task-check";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `${task.completed ? "Mark incomplete" : "Complete"}: ${task.title}`);
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          render();
        });

        const copy = document.createElement("div");
        copy.className = "task-copy";
        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.title;
        const date = document.createElement("div");
        date.className = "task-date";
        date.textContent = task.dueDate === todayKey ? "Today" : prettyDate(task.dueDate, false);
        copy.append(title, date);

        if (!noteOpen && task.note) {
          const preview = document.createElement("button");
          preview.className = "task-note-preview";
          preview.type = "button";
          preview.textContent = task.note;
          preview.title = "Open this note";
          preview.setAttribute("aria-label", `Open note for: ${task.title}`);
          preview.addEventListener("click", () => openNote(task.id, task.note));
          copy.append(preview);
        }

        const priority = document.createElement("span");
        priority.className = `priority${task.priority === "high" ? " high" : task.priority === "low" ? " low" : ""}`;
        priority.textContent = task.priority === "high" ? "Important" : task.priority === "low" ? "Whenever" : "Normal";

        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Delete: ${task.title}`);
        remove.addEventListener("click", () => {
          tasks = tasks.filter((entry) => entry.id !== task.id);
          saveTasks();
          render();
        });

        const noteToggle = document.createElement("button");
        noteToggle.className = `note-toggle${task.note ? " has-note" : ""}`;
        noteToggle.type = "button";
        noteToggle.textContent = "✎";
        noteToggle.title = task.note ? "Edit note" : "Add note";
        noteToggle.setAttribute("aria-label", `${task.note ? "Edit" : "Add"} note: ${task.title}`);
        noteToggle.setAttribute("aria-expanded", String(noteOpen));
        noteToggle.addEventListener("click", () => {
          if (noteOpen) {
            closeNoteEditor();
            render();
          } else {
            openNote(task.id, task.note);
          }
        });

        item.append(checkbox, copy, priority, noteToggle, remove);
        if (noteOpen) item.append(createNoteEditor(task));
        return item;
      }

      elements.navButtons.forEach((button) => button.addEventListener("click", () => {
        activeView = button.dataset.view;
        render();
      }));

      elements.taskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = elements.taskInput.value.trim();
        if (!title) return;
        tasks.unshift({
          id: globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          title,
          dueDate: elements.taskDate.value || todayKey,
          priority: elements.taskPriority.value,
          completed: false,
          note: ""
        });
        saveTasks();
        activeView = elements.taskDate.value > todayKey ? "upcoming" : "today";
        elements.taskForm.reset();
        render();
        elements.taskInput.focus();
      });

      elements.clearCompleted.addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        render();
      });

      elements.clearAll.addEventListener("click", () => {
        if (!clearAllTimer) {
          elements.clearAll.textContent = "Tap again to erase everything";
          elements.clearAll.classList.add("confirm");
          elements.clearAll.title = "Tap again to confirm, or wait for it to cancel";
          clearAllTimer = setTimeout(disarmClearAll, 4000);
          return;
        }
        tasks = [];
        closeNoteEditor();
        activeView = "today";
        saveTasks();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
